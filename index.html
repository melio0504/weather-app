<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather App</title><link rel="icon" href="2e794ffdb52e4107d880.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet"><script defer="defer" src="app.bundle.js"></script></head><body><header><h1>!Whether</h1><search><form><input type="search" name="searchBar" placeholder="Search city"> <button type="submit" title="Search"><img src="a27091ef0c45faf8a66e.png" width="20px" height="20px" draggable="false"></button></form></search><span id="currentTime"></span></header><main><section class="overview-info"><div class="overview"><div class="overview-temp"><img id="weather-icon" alt="Weather Icon" width="100px" height="100px" draggable="false"><h2 class="current-temp">--°</h2><span class="feel">--</span></div><img id="weather-gif" alt="Weather-based GIF" class="GIF-placeholder" draggable="false"></div><div class="additional-details"><div class="extra-card"><div class="icon-left"><img src="08fc871be54f08b6c0e3.svg" alt="Min/Max Temp" width="40px" height="40px" draggable="false"></div><div class="card-detail"><p>Min/Max Temp</p><span id="temp-range">--° / --°</span></div></div><div class="extra-card"><div class="icon-left"><img src="2c29f38f8eb2d23a97f3.svg" alt="Chance of Rain" width="40px" height="40px" draggable="false"></div><div class="card-detail"><p>Chance of Rain</p><span id="rain-chance">--%</span></div></div><div class="extra-card"><div class="icon-left"><img src="749e354e586c2010362b.svg" alt="Sunrise" width="40px" height="40px" draggable="false"></div><div class="card-detail"><p>Sunrise</p><span id="sunrise-time">--:-- AM</span></div></div><div class="extra-card"><div class="icon-left"><img src="89
